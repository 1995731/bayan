  state.attempts.push(entry);
  return entry;
}
function shuffled(items, rng = Math.random) {
  const result = [...items];
  for (let i = result.length - 1; i > 0; i--) { const j = Math.min(i, Math.floor(Math.max(0, rng()) * (i + 1))); [result[i], result[j]] = [result[j], result[i]]; }
  return result;
}

function startSession(mode, skillId = null) {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  session = { mode, skillId, index: 0, size: 6, seen: [], results: [], selected: null, hinted: false, answered: false, questions: mode === 'diagnostic' ? diagnosticQuestions() : null };
  advanceQuestion();
}
function advanceQuestion() {
  if (!session) return;
  if (session.index >= session.size) return finishSession();
  const q = session.questions ? session.questions[session.index] : nextQuestion(state, { skillId: session.skillId, seen: session.seen });
  session.q = q;
  session.seen.push(q.id);
  session.selected = null;
  session.hinted = false;
  session.answered = false;
  session.options = shuffled(q.options);
  renderQuestion();
}
function renderQuestion() {

  const diagnostic = session.mode === 'diagnostic';

'اختر ما تعرفه؛ كل إجابة تساعدنا على تحديد البداية المناسبة.' : 'لا بأس بالخطأ، نحن هنا لنتعلّم.'}</p></div>`);
  const token = $('#word-token');
  if (token) {
    token.addEventListener('dragstart', event => { event.dataTransfer.setData('text/plain', q.id); event.dataTransfer.effectAllowed = 'move'; });
    document.querySelectorAll('.answer-option').forEach(btn => {
      btn.addEventListener('dragover', event => { event.preventDefault(); if (!session?.answered) btn.classList.add('drag-over'); });
      btn.addEventListener('dragleave', () => btn.classList.remove('drag-over'));
      btn.addEventListener('drop', event => { event.preventDefault(); btn.classList.remove('drag-over'); if (event.dataTransfer.getData('text/plain') === q.id) selectAnswer(Number(btn.dataset.index)); });
    });
  }
}

function selectAnswer(index) {
  if (!session || session.answered || !session.options[index]) return;
  session.selected = session.options[index];
  document.querySelectorAll('.answer-option').forEach((button, i) => { button.classList.toggle('selected', i === index); button.setAttribute('aria-pressed', String(i === index)); });
  $('[data-action="check-answer"]').disabled = false;
}
function showHint() {
  if (!session || session.answered || session.hinted) return;
  session.hinted = true;
  const box = $('#hint-box');
  box.hidden = false;
  box.innerHTML = `<b>تلميح صغير</b><p>${getSkill(session.q.skill).tip}</p><small>تُحسب الإجابة مع مساعدة، وتكسب بها ٥ نقاط إذا صحّت.</small>`;
  const button = $('[data-action="hint"]');
  button.disabled = true;
  box.setAttribute('role', 'status');
  box.tabIndex = -1;
  box.focus();
}
function checkAnswer() {
  if (!session || session.answered || !session.selected) return;
  session.answered = true;
  const entry = recordAnswer(state, session.q, session.selected, { mode: session.mode, hinted: session.hinted });
  session.results.push(entry);
  persist();
  document.querySelectorAll('.answer-option').forEach(button => {
    button.disabled = true;
    const option = session.options[Number(button.dataset.index)];
    button.classList.toggle('correct-answer', option === session.q.answer);
    button.classList.toggle('wrong-answer', option === session.selected && !entry.correct);
  });
  $('#answer-feedback').innerHTML = `<div class="feedback ${entry.correct ? 'positive' : 'retry'}"><b>${entry.correct ? session.hinted ? 'أحسنت استخدام المساعدة! +٥ نقاط' : 'أحسنت، إجابة صحيحة! +١٠ نقاط' : 'محاولة مفيدة! لنفهمها معًا.'}</b>${!entry.correct ? `<p>الإجابة الصحيحة: <strong>${escapeHTML(session.q.answer)}</strong></p>` : ''}<p>${session.q.explanation}</p></div>`;
  $('[data-action="check-answer"]').hidden = true;
  const next = $('[data-action="next"]');
  next.hidden = false;
  if (session.index === session.size - 1) next.innerHTML = `شاهد حصيلة الجولة ${icon('arrow', 19)}`;
  if ($('[data-action="hint"]')) $('[data-action="hint"]').disabled = true;
}
function finishSession() {
  const current = session;
  if (current.mode === 'diagnostic') state.diagnosticDone = true;
  state.sessions++;
  persist();
  const independent = current.results.filter(r => r.correct && !r.hinted).length;
  const supported = current.results.filter(r => r.correct && r.hinted).length;
  const nextSkill = getSkill(recommendSkill(state));
  const points = current.results.reduce((n,a) => n + (a.correct ? a.hinted ? 5 : 10 : 0), 0);
  session = null;
  showModal(`${modalHeader('حصيلة مغامرتك')}<div class="session-summary"><span class="summary-medal" aria-hidden="true">✦</span><h2 id="activity-title">خطوة جديدة تستحقّ الفخر!</h2><p>${current.mode === 'diagnostic' ? 'اكتشفنا نقطة البداية. الآن نبني رحلتك خطوة خطوة.' : 'كل محاولة قرّبتك من فهم الجموع أكثر.'}</p><div class="summary-numbers"><div><b>${ar(independent)} / ${ar(current.size)}</b><span>صحيحة دون تلميح</span></div><div><b>+${ar(points)}</b><span>نقطة اكتشاف</span></div></div>${supported ? `<p>وأجبتَ عن ${ar(supported)} ${supported === 1 ? 'سؤال' : 'أسئلة'} بشكل صحيح مع تلميح.</p>` : ''}<div class="summary-skills">${SKILLS.filter(s => current.results.some(r => r.skill === s.id)).map(s => { const info = stats(state,s.id); return `<div><span>${s.title}</span><b>${info.mastered ? '✦ متقَن' : `${ar(info.mastery)}٪`}</b></div>`; }).join('')}</div><aside class="summary-recommendation"><b>خطوتك المقترحة: ${nextSkill.title}</b><p>${needsSupport(state,nextSkill.id) ? 'سنراجع مثالًا مبسّطًا ثم نجرّب سؤالًا جديدًا.' : 'نختار لك أسئلة تناسب ما أظهرته من فهم.'}</p></aside><div class="center-actions"><button class="button primary" data-action="adaptive">واصل المغامرة ${icon('arrow')}</button><button class="button outline" data-action="view-report">شاهد تقدّمي</button></div></div>`);
}

function speak(text) {
  if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) return toast('القراءة الصوتية غير متاحة في هذا المتصفح. يمكنك قراءة النص الظاهر.');
  const voices = window.speechSynthesis.getVoices();
  const voice = voices.find(v => v.lang.toLowerCase().startsWith('ar'));
  if (!voice) return toast('لا يتوفّر صوت عربي على هذا الجهاز. يمكنك تفعيل صوت عربي من إعدادات النظام.');
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.voice = voice;
  utterance.lang = voice.lang;
  utterance.rate = 0.85;
  utterance.onerror = () => toast('تعذّر تشغيل الصوت. حاول مجددًا أو اقرأ النص الظاهر.');
  window.speechSynthesis.speak(utterance);
}

function exportReport() {
  const report = { application: 'PluralQuest', exportedAt: new Date().toISOString(), scope: 'بيانات هذا المتصفح فقط؛ لا تتضمن أسماء الطلاب', diagnosticDone: state.diagnosticDone, sessions: state.sessions, skills: SKILLS.map(s => ({ skill: s.title, ...stats(state, s.id) })), ...overall(state), attempts: state.attempts };
  const url = URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json;charset=utf-8'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = `PluralQuest-report-${new Date().toISOString().slice(0,10)}.json`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
  toast('تمّ تجهيز تقرير التقدّم للتنزيل.');
}

document.addEventListener('click', event => {
  const button = event.target.closest('[data-action]');
  if (!button || button.disabled) return;
  const { action, skill } = button.dataset;
  switch (action) {
    case 'close': closeModal(); break;
    case 'lesson': showLesson(skill); break;
    case 'lesson-practice': if (!state.lessons.includes(skill)) state.lessons.push(skill); persist(); startSession('practice',skill); break;
    case 'practice': startSession('practice',skill); break;
    case 'adaptive': startSession('practice'); break;
    case 'diagnostic': startSession('diagnostic'); break;
    case 'select': selectAnswer(Number(button.dataset.index)); break;
    case 'check-answer': checkAnswer(); break;
    case 'hint': showHint(); break;
    case 'next': if (session?.answered) { session.index++; advanceQuestion(); } break;
    case 'view-report': closeModal(); location.hash = 'report'; break;
    case 'speak-lesson': { const s = getSkill(skill); speak(`${s.title}. ${s.rule}. ${s.note}`); break; }
    case 'speak-question': if (session) speak(`${session.q.prompt}. ${session.options.join('. أو. ')}`); break;
    case 'export': exportReport(); break;
    case 'reset': showModal(`${modalHeader('بداية جديدة')}<div class="reset-content"><h2 id="activity-title">هل تريد إعادة ضبط التقدّم؟</h2><p>سيُحذف سجلّ المحاولات والنقاط والشارات من هذا المتصفح. يمكنك تنزيل التقرير أولًا للاحتفاظ بسجلّك.</p><div class="center-actions"><button class="button outline" data-action="close">احتفظ بتقدّمي</button><button class="button danger-button" data-action="confirm-reset">نعم، ابدأ من جديد</button></div></div>`); break;
    case 'confirm-reset': state = createState(); persist(); closeModal(); toast('بدأت رحلة جديدة. كل التوفيق أيّها المستكشف!'); break;
  }
});
window.addEventListener('hashchange', () => { render(); main.focus(); window.scrollTo({top:0,behavior:'instant'}); });
render();

})();
</script>
</body>
</html>
